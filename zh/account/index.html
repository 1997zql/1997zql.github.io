body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Arial,sans-serif;

header{border-bottom:1px solid #ececec;position:sticky;top:0;background:#fff;z-index:10}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:18px}
.card{border:1px solid #ededed;border-radius:10px;overflow:hidden;transition:border-color .15s}
.card:hover{border-color:#ccc}
.card img{width:100%;display:block;background:#f7f7f7}
.card .body{padding:10px 12px}
.card .t{font-size:13px;font-weight:500}
.card .m{font-size:12px;color:#999;margin-top:2px}
.badge{display:inline-block;font-size:11px;padding:1px 6px;border-radius:4px;

.badge.paid{background:#fff4e5;color:#96591a}
.detail{display:grid;grid-template-columns:1.1fr 1fr;gap:40px;padding:36px 0}
@media(max-width:760px){.detail{grid-template-columns:1fr;gap:24px}}
.detail img{width:100%;border:1px solid #ededed;border-radius:10px;background:#f7f7f7}
.detail h1{font-size:26px;font-weight:600;letter-spacing:-.01em;margin-bottom:10px}
.specs{border-top:1px solid #f0f0f0;margin-top:20px}
.spec{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #f5f5f5;font-size:14px}
.spec span:first-child{color:#888}
.viewer{display:block;width:100%;height:420px;background:radial-gradient(circle at center,#fafafa 0%,#eaeaea 100%);border-radius:12px;margin-bottom:8px;position:relative;overflow:hidden}
.viewer-tip{position:absolute;left:0;right:0;bottom:8px;text-align:center;font-size:12px;color:#888;pointer-events:none;font-family:ui-monospace,monospace;z-index:2}
.viewer3d{position:relative;width:100%;height:420px;background:radial-gradient(circle at center,#fafafa 0%,#eaeaea 100%);border-radius:12px;margin-bottom:8px;overflow:hidden;cursor:grab}
.viewer3d:active{cursor:grabbing}
.viewer3d canvas{display:block;width:100%;height:100%}
.viewer-fallback{background:#f5f5f5;display:flex;align-items:center;justify-content:center;color:#888}
/* 无 GLB 的车型：静态车型图 + 短提示 */
.viewer3d.viewer-static{height:auto;min-height:380px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:default;background:linear-gradient(180deg,#fafafa 0%,#efefef 100%);padding:18px}
.viewer3d.viewer-static canvas{display:none}
.viewer3d.viewer-static img.viewer-static-img{max-width:100%;max-height:340px;height:auto;display:block;background:transparent}
.viewer3d.viewer-static .viewer-tip{position:static;padding:10px 0 0;font-size:12px;color:#999}
.viewer3d.viewer-static .viewer-apply,.viewer3d.viewer-static .viewer-reset{display:none}
/* 详情页静态图上的皮肤缩略角标 */
.viewer3d.viewer-static .viewer-static-badge{position:absolute;top:12px;right:12px;background:rgba(255,255,255,.95);border:1px solid #e5e5e5;border-radius:10px;padding:6px;box-shadow:0 2px 10px rgba(0,0,0,.06);z-index:3;max-width:150px}
.viewer3d.viewer-static .viewer-static-badge img{width:100%;height:auto;display:block;border-radius:6px;background:#f7f7f7}
.viewer3d.viewer-static .viewer-static-badge span{display:block;font-size:11px;color:#666;margin-top:4px;text-align:center;line-height:1.3}
.viewer-apply{position:absolute;left:14px;bottom:38px;background:rgba(255,255,255,.92);border:1px solid #ddd;border-radius:18px;padding:5px 11px;font-size:12px;color:#1a1a1a;cursor:pointer;font-family:inherit;z-index:3}
.viewer-apply:hover{background:#fff;border-color:#1a1a1a}
.viewer-reset{position:absolute;right:14px;bottom:38px;background:rgba(255,255,255,.92);border:1px solid #ddd;border-radius:18px;padding:5px 11px;font-size:12px;color:#1a1a1a;cursor:pointer;font-family:inherit;z-index:3}
.viewer-reset:hover{background:#fff;border-color:#1a1a1a}
.viewer button{background:rgba(255,255,255,.92);border:1px solid #ddd;border-radius:18px;padding:5px 11px;font-size:12px;color:#1a1a1a;cursor:pointer;font-family:inherit}
.viewer button:hover{background:#fff;border-color:#1a1a1a}
.viewer-tip{font-size:12px;color:#999;margin:0;text-align:center;font-family:ui-monospace,monospace}
.hero3d{display:grid;grid-template-columns:1.1fr 1fr;gap:32px;align-items:center;padding:48px 0 24px}
.hero3d .viewer{height:380px;margin-bottom:0}
.hero3d .copy h1{font-size:30px;font-weight:600;letter-spacing:-.02em;margin-bottom:10px}
.hero3d .copy p{font-size:15px;color:#666;margin-bottom:18px}
.hero3d .picks{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.hero3d .picks .card{cursor:pointer}
.hero3d .picks .card.active{border-color:#1a1a1a;box-shadow:0 0 0 2px rgba(26,26,26,.08)}
.model-browser{display:grid;grid-template-columns:380px 1fr;gap:32px;padding:32px 0}
.model-browser .viewer{height:420px;position:sticky;top:16px;margin-bottom:0}
.model-browser .picks{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.model-browser .picks .card{cursor:pointer;position:relative}
.model-browser .picks .card.active{border-color:#1a1a1a;box-shadow:0 0 0 2px rgba(26,26,26,.08)}
.model-browser .picks .card.active::after{content:"✓";position:absolute;top:8px;right:8px;background:#1a1a1a;color:#fff;width:22px;height:22px;border-radius:50%;font-size:13px;display:flex;align-items:center;justify-content:center;font-weight:600}
.model-browser h1{font-size:24px;font-weight:600;letter-spacing:-.01em;margin-bottom:4px}
@media(max-width:860px){.hero3d,.model-browser{grid-template-columns:1fr}.hero3d .viewer{height:300px}.model-browser .viewer{position:static;height:340px}}
.btn{display:block;text-align:center;background:#1a1a1a;color:#fff;padding:12px;
border-radius:8px;font-size:15px;font-weight:500;margin-top:20px}

.step h3{font-size:15px;font-weight:600;margin-bottom:6px}
.step .n{display:inline-block;width:22px;height:22px;line-height:22px;text-align:center;
background:#1a1a1a;color:#fff;border-radius:50%;font-size:12px;margin-bottom:8px}

border:2px solid #1a1a1a;border-radius:50%}

<div class="wrap"><section class="account" style="padding:48px 0;max-width:560px">
    <h1>我的账户</h1>
    <p style="color:#666;margin:10px 0 28px">登录后可查看已购买的涂装、下载记录。购买后下载链接会同步显示在这里。</p>
    <noscript><p>操作失败，请稍后重试</p></noscript>
    <div id="acct-unauth">
        <label style="display:block;font-size:13px;color:#555;margin-bottom:6px">邮箱地址</label>
        <input id="acct-email" type="email" placeholder="you@example.com" style="width:100%;padding:12px 14px;border:1px solid #ddd;border-radius:8px;font-size:15px" />
        <p style="font-size:12px;color:#999;margin:8px 0 16px">邮箱魔法链接登录，无需密码</p>
        <button id="acct-login" class="cta" style="width:100%;text-align:center">发送登录链接</button>
        <p id="acct-msg" style="margin-top:12px;font-size:13px;color:#888"></p>
    </div>
    <div id="acct-auth" style="display:none">
        <p style="font-size:14px;color:#555">我的购买</p>
        <div id="acct-orders" style="margin-top:12px"><p style="color:#888">加载中…</p></div>
        <button id="acct-logout" class="cta" style="margin-top:24px;background:#fff;color:#c00;border:1px solid #eee">退出登录</button>
    </div>
</section></div>
<script>
(function(){
  var URL = "https://YOUR_PROJECT.supabase.co";
  var ANON = "YOUR_ANON_KEY";
  var LANG = "zh";
  var txt = {"sent":"登录链接已发送，请检查邮箱","err":"操作失败，请稍后重试","empty":"还没有购买记录","load":"加载中…"};
  if (!URL || URL.indexOf('YOUR_') === 0) {
    var m = document.getElementById('acct-msg');
    if (m) m.textContent = 'Supabase not configured yet.';
    return;
  }
  if (typeof supabase === 'undefined') { return; }
  var sb = supabase.createClient(URL, ANON);

  var unauth = document.getElementById('acct-unauth');
  var auth = document.getElementById('acct-auth');
  var msg = document.getElementById('acct-msg');
  var email = document.getElementById('acct-email');
  var loginBtn = document.getElementById('acct-login');
  var logoutBtn = document.getElementById('acct-logout');
  var ordersEl = document.getElementById('acct-orders');

  function show(s) { unauth.style.display = s ? 'none' : 'block'; auth.style.display = s ? 'block' : 'none'; }

  async function loadOrders(user) {
    ordersEl.innerHTML = '<p style="color:#888">' + txt.load + '</p>';
    try {
      var { data, error } = await sb.from('orders')
        .select('id, skin_id, file_url, price, created_at')
        .eq('user_id', user.id);
      if (error) throw error;
      if (!data || !data.length) {
        ordersEl.innerHTML = '<p style="color:#888">' + txt.empty + '</p>';
        return;
      }
      ordersEl.innerHTML = data.map(function(o){
        return '<div style="border:1px solid #eee;border-radius:8px;padding:12px 16px;margin-bottom:10px">'
          + '<div style="font-weight:600">' + (o.skin_id || o.id) + '</div>'
          + '<div style="font-size:13px;color:#888">' + new Date(o.created_at).toLocaleString() + '</div>'
          + (o.file_url ? ' <a class="btn" style="margin-top:8px" href="' + o.file_url + '" download>下载</a>' : '')
          + '</div>';
      }).join('');
    } catch (e) { ordersEl.innerHTML = '<p style="color:#c00">' + txt.err + '</p>'; }
  }

  sb.auth.onAuthStateChange(function(event, session) {
    var user = session && session.user;
    if (user) { show(true); loadOrders(user); }
    else show(false);
  });

  if (loginBtn) loginBtn.addEventListener('click', async function(){
    if (!email || !email.value) { if (msg) msg.textContent = 'Email required'; return; }
    msg.textContent = '';
    try {
      var { error } = await sb.auth.signInWithOtp({ email: email.value });
      if (error) throw error;
      msg.textContent = txt.sent;
    } catch (e) { msg.textContent = txt.err; }
  });
  if (logoutBtn) logoutBtn.addEventListener('click', function(){ sb.auth.signOut(); });
  sb.auth.getUser();
})();
</script>
